name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Web build + lint
        run: |
          cd web
          npm ci
          npm run build
          npm run lint

      - name: Copy web dist
        run: |
          mkdir -p webembed/dist
          cp -R web/dist/* webembed/dist/

      - name: gofmt check
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Integration tests
        run: go test -tags=integration -count=1 ./test/integration/...

      - name: E2E tests (media URL recovery)
        run: go test -tags=e2e -count=1 ./test/e2e/...

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Copy web dist
        run: |
          mkdir -p webembed/dist
          cp -R web/dist/* webembed/dist/

      - name: Build Windows exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags "-X github.com/vrclog/vrclog-companion/internal/version.Version=${{ github.ref_name }}" -o vrclog.exe ./cmd/vrclog-companion

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: vrclog.exe
          generate_release_notes: true
